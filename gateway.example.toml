# Example gateway configuration
[server]
host = "127.0.0.1"
port = 9471

[gateway]
default_model = "mock-gpt"
request_timeout_secs = 30
max_retries = 2
fallback_model = "mock-gpt"

[hosted_provider]
name = "openai-compatible"
base_url = "https://api.openai.com/v1"
api_key = "sk-..." # Or set via OPENAI_API_KEY environment variable
models = ["gpt-4o-mini", "gpt-4o"]
enabled = false

[cli_provider]
enabled = false
allowlist = ["/bin/echo"]

[cli_provider.commands.cli-echo]
executable = "/bin/echo"
args = ["gateway-cli:"]
timeout_secs = 5
max_output_bytes = 65536
