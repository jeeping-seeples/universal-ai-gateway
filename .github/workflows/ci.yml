
name: Universal AI Gateway CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install ARM64 cross-compilation toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build ARM64 release
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify binary architecture
        run: |
          file target/aarch64-unknown-linux-gnu/release/universal-ai-gateway
          readelf -h target/aarch64-unknown-linux-gnu/release/universal-ai-gateway | grep Machine

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: universal-ai-gateway-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/universal-ai-gateway
          retention-days: 14
